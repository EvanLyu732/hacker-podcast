name: Refresh podcast data

on:
  schedule:
    # 04:00 and a retry at 05:30 in Beijing time (UTC+08:00).
    - cron: '0 20 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check whether today's refresh already succeeded
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          zone = dt.timezone(dt.timedelta(hours=8))
          snapshot = json.loads(Path('dist/data.json').read_text())
          updated = dt.datetime.fromisoformat(snapshot['updated_at'].replace('Z', '+00:00')).astimezone(zone)
          run = os.environ['EVENT_NAME'] != 'schedule' or updated.date() != dt.datetime.now(zone).date()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('needed=' + ('true' if run else 'false'), file=out)
          print('Last successful data snapshot:', updated.isoformat(), '; refresh needed:', run)
          PY

      - name: Run and validate the data pipeline
        if: steps.freshness.outputs.needed == 'true'
        run: python3 scripts/refresh_pipeline.py

      - name: Commit validated output
        if: steps.freshness.outputs.needed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/data.json dist/details.json dist/episode-audit.json dist/episode-audit.md data snapshots
          if git diff --cached --quiet; then
            echo 'Pipeline reported success but did not produce updated files.' >&2
            exit 1
          fi
          git diff --cached --stat
          git commit -m 'Refresh Hacker Podcast data'
          # A concurrent source change must fail rather than overwrite it.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

      - name: Verify the public deployment and retry it if needed
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: python3 scripts/verify_publication.py
